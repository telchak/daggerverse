[project]
name = "goose"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io", "agent-base", "dagger-clients-core", "dagger-clients-gcp-auth", "dagger-clients-gcp-cloud-run", "dagger-clients-gcp-artifact-registry", "dagger-clients-gcp-firebase", "dagger-clients-gcp-vertex-ai", "dagger-clients-health-check", "dagger-clients-github-issue"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { workspace = true }
agent-base = { path = "../_agent_base", editable = true }
dagger-clients-core = { workspace = true }
dagger-clients-gcp-auth = { workspace = true }
dagger-clients-gcp-cloud-run = { workspace = true }
dagger-clients-gcp-artifact-registry = { workspace = true }
dagger-clients-gcp-firebase = { workspace = true }
dagger-clients-gcp-vertex-ai = { workspace = true }
dagger-clients-health-check = { workspace = true }
dagger-clients-github-issue = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "clients/core", "clients/gcp-auth", "clients/gcp-cloud-run", "clients/gcp-artifact-registry", "clients/gcp-firebase", "clients/gcp-vertex-ai", "clients/health-check", "clients/github-issue"]

[tool.dagger]
global-client = true
