sonar.python.version=3.13

# Skip copy-paste detection for modules with intentional structural duplication:
# - Agent modules (monty, angie, goose): share workspace tools, GitHub integration patterns
# - Test modules: repeat OIDC / Service Account / Access Token auth scaffolding per GCP service
# - Example modules: follow consistent Dagger @function boilerplate for documentation
sonar.cpd.exclusions=\
  monty/src/**,angie/src/**,goose/src/**,speck/src/**,daggie/src/**,\
  tests/src/**,\
  */examples/**

# Not project code:
# - vendored third-party tooling (okf-skills scripts)
# - Dagger 1.0 generated code committed in every module: the vendored SDK and the
#   static entrypoint (sdk/), and the generated module clients (clients/)
sonar.exclusions=.claude/**,*/sdk/**,*/clients/**
