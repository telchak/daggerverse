[project]
name = "gcp-auth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io", "dagger-clients-core", "dagger-clients-oidc-token"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }
dagger-clients-oidc-token = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "clients/core", "clients/oidc-token"]

[tool.dagger]
global-client = true
